[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symphonix"
version = "1.0.1"
description = "Find, play, download and use public-domain classical music in your terminal - with animated composer art, a reactive equalizer, playlists and a quiz mode."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "thisisforlearn" }]
keywords = [
    "music", "classical", "cli", "tui", "terminal", "player",
    "public-domain", "musopen", "archive.org", "imslp",
    "composer", "ascii-art", "download", "play",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Players",
    "Topic :: Artistic Software",
]
dependencies = [
    "rich>=13.0",
    "requests>=2.28",
    "miniaudio>=1.59",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/thisisforlearn/classical"
Repository = "https://github.com/thisisforlearn/classical"
Issues = "https://github.com/thisisforlearn/classical/issues"

[project.scripts]
sx = "symphonix.cli:main"
symphonix = "symphonix.cli:main"

[tool.setuptools]
packages = ["symphonix", "symphonix.sources"]
